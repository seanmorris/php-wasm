name: Test CGI Node

on:
  workflow_call:
    inputs:
      phpVersion:
        required: true
        type: string
      libType:
        required: true
        type: string
      artifactPattern:
        required: true
        type: string

jobs:
  test:
    name: Test Cgi Node ${{ inputs.phpVersion }} w/${{ inputs.libType }} libs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Disable man-db auto-update
        run: |
          echo "set man-db/auto-update false" | sudo debconf-communicate
          sudo dpkg-reconfigure man-db

      - name: Import configuration
        run: |
          cp -p .github/.env_${{ inputs.phpVersion }}.${{ inputs.libType }}.ci .env
          touch -d '1970-01-01 00:00:00 UTC' .env

      - name: Cache Docker image
        id: cache-docker-image
        uses: actions/cache@v5
        with:
          path: /tmp/builder-image.tar
          key: ${{ runner.os }}-docker-${{ hashFiles('emscripten-builder.dockerfile', 'patch/emscripten-6.0.6.patch', '.github/bin/retry-embuilder.sh', '.github/bin/verify-emscripten-profile-runtime.sh', '.github/bin/verify-emscripten-fibers.sh', '.github/bin/verify-emscripten-async-errors.sh') }}

      - name: Load builder image if cached
        if: steps.cache-docker-image.outputs.cache-hit == 'true'
        run: docker load -i /tmp/builder-image.tar && rm -f /tmp/builder-image.tar

      - name: Create builder image (if not cached)
        if: steps.cache-docker-image.outputs.cache-hit != 'true'
        run: |
          time make --debug=basic image
          docker save -o /tmp/builder-image.tar seanmorris/php-emscripten-builder:latest

      - name: Verify Docker Compose
        run: docker compose version

      - name: Verify builder Git cache ownership support
        run: bash .github/bin/verify-builder-git.sh

      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifactPattern }}
          merge-multiple: true
          path: ./

      - name: Extract Artifact
        run: |
          for TAR in ${{ inputs.artifactPattern }}.tar.gz; do
            tar -xzf ${TAR}
          done;

      - name: Flatten mtimes after extraction
        run: find . \( -name node_modules -o -name .git \) -type d -prune -o -type f -print0 | xargs -0 touch -d '1970-01-01 00:00:00 UTC'

      - name: Apply executable cache
        run: |
          shopt -s nullglob
          for CACHE in ./.cache/executables-*; do
            xargs -r -a "${CACHE}" chmod +x
          done

      - name: Install NPM packages
        run: |
          npm ci

      - name: Run tests
        run: |
          PHP_VERSION=${{ inputs.phpVersion }} LIB_TYPE=${{ inputs.libType }} make --debug=basic test-cgi-node
          PHP_VERSION=${{ inputs.phpVersion }} LIB_TYPE=${{ inputs.libType }} make --debug=basic test-cgi-node-cjs

      - name: Take Failure Snapshot
        if: ${{ failure() }}
        run: |
          sudo chown -R ${USER}:${USER} .
          sudo chmod -R u+rwX,go+rX .
          tar --exclude=.git --exclude='snapshot.tar.gz' --ignore-failed-read --warning=no-file-changed -czf snapshot.tar.gz .

      - name: Upload Failure Artifact
        uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: failure-snapshot-cgi-node-test-${{ inputs.phpVersion }}-${{ inputs.libType }}
          path: snapshot.tar.gz
          compression-level: 0
