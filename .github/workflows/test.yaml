name: Test

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SKIP_PACKAGING_TEST: 1

jobs:

  runtime-types:
    uses: ./.github/workflows/test-types-step.yaml

  vrzno-importer:
    needs: runtime-types
    name: Test Build Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Install Deno
        run: npm install -g deno@2.5.6
      - name: Test build helpers under inherited Make settings (Node)
        env:
          MAKEFLAGS: '--debug=basic -- PHP_VERSION=8.3 LIB_TYPE=shared'
        run: node --test test/builder-worktree.test.mjs test/preload-assets.test.mjs test/download-retry.test.mjs test/cgi-builder-workflow.test.mjs
      - name: Test build helpers under inherited Make settings (Deno)
        env:
          MAKEFLAGS: '--debug=basic -- PHP_VERSION=8.3 LIB_TYPE=shared'
        run: deno test test/builder-worktree.test.mjs test/preload-assets.test.mjs test/download-retry.test.mjs test/cgi-builder-workflow.test.mjs --allow-read --allow-write --allow-env --allow-net --allow-sys --allow-run=npm,bash,node,make
      - name: Verify packaged builder helpers
        run: node --test test/build/builder-tools-packaging.test.mjs
      - name: Verify Cloudflare wrapper, profile, artifact and D1 regressions
        run: >-
          node --test test/php-cloudflare.test.mjs
          test/php-base-queue.test.mjs
          test/builder-help.test.mjs
          test/build/cloudflare-build.test.mjs
          test/build/pdo-cfd1-importer.test.mjs
          test/cloudflare/artifacts.test.mjs
      - name: Verify Pages routing and safe nightly promotion
        run: npm run test:cloudflare-pages
      - name: Test the real Make importer without PHP builds
        run: node --test test/build/vrzno-importer.test.mjs test/build/pdo-pglite-importer.test.mjs test/build/waitline-importer.test.mjs
      - name: Build the lightweight root-owned importer fixture
        run: docker build -f test/build/vrzno-importer.Dockerfile -t php-wasm-vrzno-importer test/build
      - name: Require nonroot host and root builder ownership tests
        env:
          VRZNO_IMPORTER_DOCKER: '1'
          PDO_PGLITE_IMPORTER_DOCKER: '1'
          WAITLINE_IMPORTER_DOCKER: '1'
        run: node --test test/build/vrzno-importer.test.mjs test/build/pdo-pglite-importer.test.mjs test/build/waitline-importer.test.mjs

  test-8-5-static:
    needs: vrzno-importer
    name: Test 8.5 Static
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - run: npm install
      - run: npm install -g deno@2.5.6
      - run: |
          echo "set man-db/auto-update false" | sudo debconf-communicate
          sudo dpkg-reconfigure man-db
      - run: docker compose version
      - run: cp .circleci/.env_8.5.ci .env
      - run: make image
      - run: PHP_VERSION=8.5 make test

