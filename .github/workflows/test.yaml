name: Test

on:
  push:
    paths-ignore:
      - '.cloudflare/pages/functions/\[\[path\]\].js'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SKIP_PACKAGING_TEST: 1

jobs:

  vrzno-importer:
    name: Test Vrzno Source Importer
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test the real Make importer without PHP builds
        run: node --test test/build/vrzno-importer.test.mjs
      - name: Build the lightweight root-owned importer fixture
        run: docker build -f test/build/vrzno-importer.Dockerfile -t php-wasm-vrzno-importer test/build
      - name: Require nonroot host and root builder ownership tests
        env:
          VRZNO_IMPORTER_DOCKER: '1'
        run: node --test test/build/vrzno-importer.test.mjs

  test-8-5-static:
    needs: vrzno-importer
    name: Test 8.5 Static
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - run: npm install
      - run: npm install -g deno@2.5.6
      - run: |
          echo "set man-db/auto-update false" | sudo debconf-communicate
          sudo dpkg-reconfigure man-db
      - run: docker compose version
      - run: cp .circleci/.env_8.5.ci .env
      - run: make image
      - run: PHP_VERSION=8.5 make test

  test-8-4-static:
