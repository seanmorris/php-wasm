name: Test Demo Web Artifact

on:
  workflow_call:
    inputs:
      artifactName:
        required: true
        type: string
      libType:
        required: true
        type: string

jobs:
  test:
    name: Test demo-web artifact w/${{ inputs.libType }} libs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Disable man-db auto-update
        run: |
          echo "set man-db/auto-update false" | sudo debconf-communicate
          sudo dpkg-reconfigure man-db

      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifactName }}
          path: ./

      - name: Extract Artifact
        run: |
          for TAR in php-demo-web-${{ inputs.libType }}.tar.gz; do
            tar -xzf ${TAR}
          done;

      - name: Install NPM packages
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e "import { chromium } from '@playwright/test'; console.log('PLAYWRIGHT_CHROMIUM_PATH=' + chromium.executablePath())" >> "$GITHUB_ENV"

      - name: Run tests
        run: LIB_TYPE=${{ inputs.libType }} DEMO_WEB_ARTIFACT_ROOT=docs make --debug=basic test-demo-web

      - name: Take Failure Snapshot
        if: ${{ failure() }}
        run: |
          sudo chown -R ${USER}:${USER} .
          sudo chmod -R u+rwX,go+rX .
          tar --exclude=.git \
            --exclude='demo-web-artifact-failure.tar.gz' \
            --ignore-failed-read \
            --warning=no-file-changed \
            -czf demo-web-artifact-failure.tar.gz \
              php-demo-web-${{ inputs.libType }}.tar.gz \
              docs \
              test-results

      - name: Upload Failure Artifact
        uses: actions/upload-artifact@v6
        if: ${{ failure() }}
        with:
          name: failure-snapshot-demo-web-test-${{ inputs.libType }}
          path: demo-web-artifact-failure.tar.gz
          compression-level: 0
